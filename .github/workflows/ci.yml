name: CI

# Runs install, lint, typecheck, tests and a production build on every push to
# a branch other than main. It never runs on, pushes to or modifies main.
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # only used to commit package-lock.json to a non-main branch

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package-lock.json yet; creating one with npm install."
            npm install
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      # The lockfile pins exact dependency versions. It is created here because
      # packages cannot be installed in the authoring environment. This step
      # runs only after every check above has passed, only for pushes, and
      # refuses to touch main.
      - name: Commit package-lock.json if it is new or changed
        if: github.event_name == 'push'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" = "main" ]; then
            echo "Refusing to commit to main."
            exit 0
          fi
          if [ -z "$(git status --porcelain package-lock.json)" ]; then
            echo "package-lock.json is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add or update package-lock.json [skip ci]"
          git push origin "HEAD:refs/heads/$BRANCH"
