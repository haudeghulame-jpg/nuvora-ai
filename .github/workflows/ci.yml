name: CI

# Runs install, lint, typecheck, tests and a production build on every push to
# a branch other than main. It never runs on, pushes to or modifies main.
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # only used to commit package-lock.json to a non-main branch

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          # Strict install from the lockfile when it matches package.json.
          # When package.json was edited without a lockfile update (dependencies
          # cannot be installed in the authoring environment), fall back to
          # npm install, which updates the lockfile; it is committed below only
          # after every check passes.
          if [ -f package-lock.json ] && npm ci; then
            echo "Installed exactly from package-lock.json."
          else
            echo "Lockfile missing or out of date; running npm install to update it."
            npm install
          fi

      # Informational only. It prints which packages are flagged, how severe
      # each is, the dependency paths and the available fixes. It never fails
      # the build and never applies a fix: dependency changes need approval.
      - name: Security audit report (does not fail the build)
        continue-on-error: true
        run: |
          npm audit --json > audit.json || true
          node scripts/audit-report.mjs audit.json
          echo
          echo "--- npm's own readable report ---"
          npm audit || true

      - name: Lint
        run: npm run lint

      # Informational for now: the code was written without being able to run
      # Prettier. The result is reported here; it becomes blocking once the
      # files are formatted.
      - name: Formatting check (informational, does not fail the build)
        continue-on-error: true
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      # The lockfile pins exact dependency versions. It is created here because
      # packages cannot be installed in the authoring environment. This step
      # runs only after every check above has passed, only for pushes, and
      # refuses to touch main.
      - name: Commit package-lock.json if it is new or changed
        if: github.event_name == 'push'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" = "main" ]; then
            echo "Refusing to commit to main."
            exit 0
          fi
          if [ -z "$(git status --porcelain package-lock.json)" ]; then
            echo "package-lock.json is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add or update package-lock.json [skip ci]"
          git push origin "HEAD:refs/heads/$BRANCH"
