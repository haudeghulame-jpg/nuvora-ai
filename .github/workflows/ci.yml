name: CI

# Runs install, lint, typecheck, tests and a production build on every push to
# a branch other than main. It never runs on, pushes to or modifies main.
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # only used to commit package-lock.json to a non-main branch

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          # Strict install from the lockfile when it matches package.json.
          # When package.json was edited without a lockfile update (dependencies
          # cannot be installed in the authoring environment), fall back to
          # npm install, which updates the lockfile; it is committed below only
          # after every check passes.
          if [ -f package-lock.json ] && npm ci; then
            echo "Installed exactly from package-lock.json."
          else
            echo "Lockfile missing or out of date; running npm install to update it."
            npm install
          fi

      # Informational only. It prints which packages are flagged, how severe
      # each is, the dependency paths and the available fixes. It never fails
      # the build and never applies a fix: dependency changes need approval.
      - name: Security audit report (does not fail the build)
        continue-on-error: true
        run: |
          npm audit --json > audit.json || true
          node scripts/audit-report.mjs audit.json
          echo
          echo "--- npm's own readable report ---"
          npm audit || true

      # Code is written without being able to run Prettier locally, so on
      # branch pushes CI applies it first and every check below then runs on
      # the formatted files. The result is committed at the end, after all
      # checks pass. The four original documents are excluded by
      # .prettierignore, and this step fails if any of them would change.
      - name: Apply Prettier formatting (branch pushes only)
        if: github.event_name == 'push' && github.ref_name != 'main'
        run: |
          npm run format
          CHANGED_PROTECTED="$(git diff --name-only -- README.md CLAUDE.md docs/PRODUCT_SPEC_AR.md docs/ROADMAP.md)"
          if [ -n "$CHANGED_PROTECTED" ]; then
            echo "A protected document would be modified; refusing:"
            echo "$CHANGED_PROTECTED"
            exit 1
          fi
          echo "Files changed by formatting:"
          git diff --name-only

      - name: Lint
        run: npm run lint

      - name: Formatting check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Tests the Firestore security rules against the local Firebase emulator.
      # Free, runs only on this runner, uses no Firebase project and no
      # billing. The Firebase CLI is fetched on demand and is not a project
      # dependency.
      - name: Set up Java (needed by the Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Firestore security rules tests (local emulator)
        run: >
          npx --yes firebase-tools@15 emulators:exec --only firestore
          --project demo-nuvora "npm run test:rules"

      - name: Production build
        run: npm run build

      # The lockfile pins exact dependency versions, and formatting is applied
      # by CI. Both are needed because packages and Prettier cannot be run in
      # the authoring environment. This step runs only after every check above
      # has passed, only for pushes, never touches main, and stages only files
      # git already tracks (so generated files such as audit.json are skipped).
      - name: Commit lockfile and formatting changes if any
        if: github.event_name == 'push'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" = "main" ]; then
            echo "Refusing to commit to main."
            exit 0
          fi
          git add -u
          if git diff --cached --quiet; then
            echo "No lockfile or formatting changes to commit."
            exit 0
          fi
          echo "Committing:"
          git diff --cached --name-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update package-lock.json and apply Prettier formatting [skip ci]"
          git push origin "HEAD:refs/heads/$BRANCH"
